[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legallens"
version = "2.0.0"
description = "LegalLens 2.0 - OpenEnv AI Legal Reasoning Environment for Indian Law"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LegalLens Team" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
legallens-server = "server.app:app"

[tool.hatch.build.targets.wheel]
packages = [
    "environment",
    "legal",
    "tasks",
    "graders",
    "server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
